# The two agents that run on their team's own platform (here, Docker), and the
# demo's page. Agent Manager runs the two others itself. Started by ./run.sh,
# with config.env and what configure/ wrote to secrets.env: the keys and
# identities Agent Manager handed out, and where the agents answer.
name: agent-manager

x-agent: &agent
  restart: unless-stopped
  mem_limit: 512m
  # Agent Manager's gateways, trace collector and identity provider, and the
  # main demo's gateways, as Docker reaches them.
  extra_hosts:
    - "production-default.gateway.localhost:host-gateway"
    - "production-default.am-gateway.localhost:host-gateway"
    - "production-idp.amp.localhost:host-gateway"
    - "host.docker.internal:host-gateway"

x-agent-env: &agent-env
  BANK_NAME: ${BANK_NAME}
  MODEL: ${MODEL}
  EFFORT: ${EFFORT}
  AMP_OTEL_ENDPOINT: ${AMP_OTEL_ENDPOINT}
  AMP_AGENTID_TOKEN_ENDPOINT: ${AMP_AGENTID_TOKEN_ENDPOINT}

services:
  concierge:
    <<: *agent
    build: {context: agents, args: {AGENT: concierge}}
    environment:
      <<: *agent-env
      LLM_URL: ${CONCIERGE_LLM_URL}
      LLM_KEY: ${CONCIERGE_LLM_KEY}
      AMP_AGENT_API_KEY: ${CONCIERGE_TRACING_KEY}
      AMP_AGENTID_CLIENT_ID: ${CONCIERGE_CLIENT_ID}
      AMP_AGENTID_CLIENT_SECRET: ${CONCIERGE_CLIENT_SECRET}
      # The specialists: two behind Agent Manager's gateway, one on this platform.
      CARDS_AGENT_URL: ${CARDS_AGENT_URL}
      TRAVEL_DESK_URL: ${TRAVEL_DESK_URL}
      POLICY_ADVISOR_URL: http://policy-advisor:8000
    depends_on: [policy-advisor]

  policy-advisor:
    <<: *agent
    build: {context: agents, args: {AGENT: policy-advisor}}
    environment:
      <<: *agent-env
      LLM_URL: ${POLICY_ADVISOR_LLM_URL}
      LLM_KEY: ${POLICY_ADVISOR_LLM_KEY}
      AMP_AGENT_API_KEY: ${POLICY_ADVISOR_TRACING_KEY}
      AMP_AGENTID_CLIENT_ID: ${POLICY_ADVISOR_CLIENT_ID}
      AMP_AGENTID_CLIENT_SECRET: ${POLICY_ADVISOR_CLIENT_SECRET}
      # It takes requests from the Concierge only, checked on its Agent Manager identity.
      ALLOWED_CALLERS: concierge:${CONCIERGE_CLIENT_ID}
    # The main demo's product catalogue.
    volumes:
      - ${CATALOGUE_FILE}:/app/catalogue.md:ro

  page:
    image: python:3.12-alpine
    restart: unless-stopped
    mem_limit: 128m
    command: ["python", "/web/server.py"]
    working_dir: /web
    # The page reads the fleet from the file that sets Agent Manager up.
    volumes:
      - ./web:/web:ro
      - ./configure:/configure:ro
    ports:
      - "${PAGE_PORT}:8610"
    # Agent Manager's API, traces and gateways, and the main demo's gateways.
    extra_hosts:
      - "api.amp.localhost:host-gateway"
      - "thunder.amp.localhost:host-gateway"
      - "traces.amp.localhost:host-gateway"
      - "production-default.am-gateway.localhost:host-gateway"
      - "default-default.am-gateway.localhost:host-gateway"
      - "production-idp.amp.localhost:host-gateway"
      - "host.docker.internal:host-gateway"
    environment:
      BANK_NAME: ${BANK_NAME}
      CUSTOMER_NAME: ${CUSTOMER_NAME}
      MODEL: ${MODEL}
      MAIN_DEMO_URL: ${MAIN_DEMO_URL}
      CONCIERGE_URL: http://concierge:8000
      CARDS_AGENT_URL: ${CARDS_AGENT_URL}
      CARDS_AGENT_TRIAL_URL: ${CARDS_AGENT_TRIAL_URL}
      # In act 1, the page tries to command the Cards Agent with the Policy Advisor's identity.
      AMP_AGENTID_TOKEN_ENDPOINT: ${AMP_AGENTID_TOKEN_ENDPOINT}
      POLICY_ADVISOR_CLIENT_ID: ${POLICY_ADVISOR_CLIENT_ID}
      POLICY_ADVISOR_CLIENT_SECRET: ${POLICY_ADVISOR_CLIENT_SECRET}
      MCP_URL: ${MCP_URL}
      # The partner's agent, through the card the gateway vetted or through its own.
      TRAVEL_INSURANCE_URL: ${TRAVEL_INSURANCE_URL}
      TRAVEL_INSURANCE_OWN_URL: ${TRAVEL_INSURANCE_OWN_URL}
      AMP_CONSOLE_URL: ${AMP_CONSOLE_URL}
      AMP_API_URL: ${AMP_API_URL}
      AMP_TRACES_URL: ${AMP_TRACES_URL}
      AMP_TOKEN_URL: ${AMP_TOKEN_URL}
      AMP_CLIENT_ID: ${AMP_CLIENT_ID}
      AMP_CLIENT_SECRET: ${AMP_CLIENT_SECRET}
      AMP_ORG: ${AMP_ORG}
      AMP_PROJECT: ${AMP_PROJECT}
      AMP_ENVIRONMENT: ${AMP_ENVIRONMENT}
      AMP_TRIAL_ENVIRONMENT: ${AMP_TRIAL_ENVIRONMENT}
    depends_on: [concierge]
